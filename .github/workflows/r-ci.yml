name: r-ci
on:
  push:
    paths: ["r/**", "src/**", "tests/**", ".github/workflows/r-ci.yml"]
  pull_request:
    paths: ["r/**", "src/**", "tests/**", ".github/workflows/r-ci.yml"]
jobs:
  R-CMD-check:
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.os }} (R release)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Regenerate the golden values from the Python package of this commit
        run: |
          pip install -e .
          pip install pytest
          python r/tools/make_fixtures.py
          MODEL=$(python r/tools/make_real_golden.py)
          echo "SUPERSLIM_MODEL=$MODEL" >> "$GITHUB_ENV"
        shell: bash
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: r
          extra-packages: any::rcmdcheck
          needs: check
      - uses: r-lib/actions/check-r-package@v2
        with:
          working-directory: r
